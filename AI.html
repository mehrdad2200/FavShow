<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FavShow AI Beast | t.me/favme</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: #050505; --card: #111; --accent: #00d2ff; --ai: #a855f7; --text: #fff; --gold: #ffcc00; }
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg); color: var(--text); overflow-x: hidden; }

        /* Full AI Integration Styles */
        #main-loader { position: fixed; inset: 0; background: var(--bg); z-index: 10000; display: flex; align-items: center; justify-content: center; }
        .ai-glow { width: 80px; height: 80px; background: var(--accent); border-radius: 50%; filter: blur(40px); animation: pulse 1s infinite alternate; }
        @keyframes pulse { from { opacity: 0.4; transform: scale(0.8); } to { opacity: 1; transform: scale(1.2); } }

        header { position: sticky; top:0; height: 70px; background: rgba(5,5,5,0.9); backdrop-filter: blur(20px); display: flex; align-items: center; justify-content: space-between; padding: 0 25px; z-index: 1000; border-bottom: 1px solid #222; }
        .brand { font-size: 1.6rem; font-weight: 900; color: var(--accent); text-decoration: none; cursor: pointer; display: flex; align-items: center; gap: 10px; }

        .container { padding: 20px; max-width: 1400px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        @media (min-width: 768px) { .grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); } }

        .item-card { background: var(--card); border-radius: 20px; overflow: hidden; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); cursor: pointer; border: 1px solid #222; position: relative; }
        .item-card:hover { transform: translateY(-10px) scale(1.02); border-color: var(--accent); box-shadow: 0 10px 30px rgba(0,210,255,0.2); }
        .item-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
        .card-meta { padding: 15px; }
        .rating { position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.8); color: gold; padding: 4px 10px; border-radius: 8px; font-weight: 900; font-size: 0.8rem; backdrop-filter: blur(5px); }

        #details-view { display: none; position: fixed; inset: 0; background: var(--bg); z-index: 2000; overflow-y: auto; padding-bottom: 60px; }
        .hero { width: 100%; height: 60vh; position: relative; }
        #h-backdrop { width: 100%; height: 100%; object-fit: cover; }
        .hero-fade { position: absolute; inset: 0; background: linear-gradient(0deg, var(--bg) 5%, transparent 100%); }

        /* AI Beast Box */
        .ai-box { background: #0a0a0a; border: 1px solid var(--ai); padding: 30px; border-radius: 30px; margin: 30px 0; position: relative; overflow: hidden; }
        .ai-box::before { content: 'AI POWERED'; position: absolute; top: 10px; right: 20px; font-size: 0.6rem; color: var(--ai); letter-spacing: 3px; font-weight: 900; }
        .ai-content { color: #eee; line-height: 2; font-size: 1rem; text-align: justify; }
        
        .ai-btn-group { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 25px; }
        .btn { padding: 12px 22px; border-radius: 15px; border: none; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: 0.3s; font-size: 0.8rem; color: #fff; }
        .btn-groq { background: var(--ai); }
        .btn-gemini { background: #1a73e8; box-shadow: 0 0 15px rgba(26, 115, 232, 0.4); }
        .btn-or { background: #00c9a7; }
        .btn-cere { background: #ff3e00; }

        .scroller { display: flex; gap: 20px; overflow-x: auto; padding: 15px 5px; scrollbar-width: none; }
        .actor-pill { flex: 0 0 110px; text-align: center; transition: 0.4s; cursor: pointer; }
        .actor-pill:hover { transform: scale(1.15); }
        .actor-pill img { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 3px solid #222; margin-bottom: 10px; }
        .actor-pill:hover img { border-color: var(--accent); }

        input#search { width: 100%; padding: 22px; background: #111; border: 1px solid #222; border-radius: 20px; color: #fff; margin-bottom: 30px; outline: none; font-size: 1.1rem; transition: 0.4s; }
        input#search:focus { border-color: var(--accent); box-shadow: 0 0 25px rgba(0,210,255,0.2); }
    </style>
</head>
<body>

<div id="main-loader"><div class="ai-glow"></div></div>

<header>
    <div class="brand" onclick="goHome()">
        <i class="fas fa-home" style="color:var(--accent);"></i>
        <span>FAVSHOW MASTER</span>
    </div>
    <a href="https://t.me/favme" target="_blank" style="color:var(--gold); text-decoration:none; font-weight:900; font-size:1rem; letter-spacing:1px;">t.me/favme</a>
</header>

<main class="container" id="list-view">
    <input type="text" id="search" placeholder="Search movies, series or AI analysis..." oninput="smartSearch(this.value)">
    
    <div class="scroller" style="margin-bottom:30px;">
        <button class="btn" style="background:var(--accent); color:#000;" onclick="loadData('tv')">TV SERIES</button>
        <button class="btn" style="background:#111;" onclick="loadData('movie')">MOVIES</button>
        <button class="btn" style="background:#111;" onclick="loadData('ani')">ANIMATIONS</button>
    </div>

    <div class="grid" id="main-grid"></div>
</main>

<div id="details-view">
    <div class="hero">
        <img id="h-backdrop" src="">
        <div class="hero-fade"></div>
        <div onclick="goHome()" style="position:absolute; top:25px; left:25px; background:rgba(0,0,0,0.7); width:50px; height:50px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:10;"><i class="fas fa-chevron-left"></i></div>
    </div>
    
    <div class="container" style="margin-top:-80px; position:relative; z-index:5;">
        <h1 id="h-title" style="font-size:3.5rem; font-weight:900; letter-spacing:-1px;"></h1>
        <div style="display:flex; gap:20px; margin:25px 0; color:gold; font-weight:900; font-size:1.1rem;">
            <span><i class="fab fa-imdb"></i> <span id="h-rating"></span></span>
            <span id="h-year" style="color:#666;"></span>
        </div>

        <div class="ai-box">
            <h3 style="color:var(--ai); margin-bottom:15px; font-weight:900;"><i class="fas fa-bolt"></i> ULTIMATE AI ENGINE</h3>
            <div id="ai-content" class="ai-content">Initializing Groq Pro analysis...</div>
            <div class="ai-btn-group">
                <button class="btn btn-groq" onclick="askAI('groq')"><i class="fas fa-rocket"></i> GROQ PRO</button>
                <button class="btn btn-gemini" onclick="askAI('gemini')"><i class="fab fa-google"></i> GEMINI 1.5</button>
                <button class="btn btn-or" onclick="askAI('openrouter')"><i class="fas fa-brain"></i> OPENROUTER</button>
                <button class="btn btn-cere" onclick="askAI('cerebras')"><i class="fas fa-microchip"></i> CEREBRAS</button>
            </div>
        </div>

        <div style="display:flex; gap:15px; margin-bottom:40px;">
            <button class="btn" id="yt-btn" style="background:#f00; padding:15px 35px; font-size:1rem;"><i class="fab fa-youtube"></i> WATCH TRAILER</button>
        </div>

        <h3 style="color:var(--accent); font-weight:900; margin-bottom:15px; font-size:1.4rem;">STORYLINE</h3>
        <p id="h-desc" style="color:#aaa; line-height:2; font-size:1.1rem; max-width:900px;"></p>

        <h3 style="margin-top:50px; color:var(--accent); font-weight:900; font-size:1.4rem;">TOP CAST</h3>
        <div class="scroller" id="h-cast"></div>
    </div>
</div>

<script>
    const TMDB_KEY = "20036293ca9656e18bb0410862f95d38";
    const GROQ_KEY = "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";
    const GEMINI_KEY = "AIzaSyAag_vTw8H-wVDcX5CulMK-LnUGOgUKm58";
    const OR_KEY = "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";
    const CEREBRAS_KEY = "csk-k6t39ft5rh3md4962kxp55fncrkptyt3nv3kt2xhtkvrendv";

    let currentItem = null;

    // Fix Mouse Back/Forward Navigation
    window.addEventListener('popstate', (e) => {
        if (e.state && e.state.id) openDetails(e.state.id, e.state.type, false);
        else goHome(false);
    });

    async function init() {
        await loadData('tv');
        document.getElementById('main-loader').style.display = 'none';
    }

    async function loadData(type) {
        showL(true);
        const url = type === 'ani' ? 
            `https://api.themoviedb.org/3/discover/tv?api_key=${TMDB_KEY}&with_genres=16` : 
            `https://api.themoviedb.org/3/trending/${type}/week?api_key=${TMDB_KEY}`;
        const res = await fetch(url).then(r => r.json());
        renderGrid(res.results);
        showL(false);
    }

    function renderGrid(data) {
        document.getElementById('main-grid').innerHTML = data.map(i => `
            <div class="item-card" onclick="openDetails(${i.id}, '${i.name?'tv':'movie'}')">
                <div class="rating">${i.vote_average.toFixed(1)}</div>
                <img src="https://image.tmdb.org/t/p/w500${i.poster_path}" onerror="this.src='https://via.placeholder.com/300x450'">
                <div class="card-meta">
                    <h4 style="font-size:0.9rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${i.name || i.title}</h4>
                </div>
            </div>
        `).join('');
    }

    async function smartSearch(q) {
        if(q.length < 2) return;
        const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${TMDB_KEY}&query=${q}`).then(r => r.json());
        renderGrid(res.results.filter(i => i.poster_path));
    }

    async function openDetails(id, type, push = true) {
        showL(true);
        const data = await fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${TMDB_KEY}&append_to_response=credits,videos`).then(r => r.json());
        currentItem = data;

        if(push) history.pushState({id, type}, '', `#${id}`);

        document.getElementById('list-view').style.display = 'none';
        document.getElementById('details-view').style.display = 'block';
        window.scrollTo(0,0);

        document.getElementById('h-backdrop').src = `https://image.tmdb.org/t/p/w1280${data.backdrop_path}`;
        document.getElementById('h-title').innerText = data.name || data.title;
        document.getElementById('h-rating').innerText = data.vote_average.toFixed(1);
        document.getElementById('h-year').innerText = (data.first_air_date || data.release_date || '').split('-')[0];
        document.getElementById('h-desc').innerText = data.overview;

        const yt = data.videos.results.find(v => v.site === 'YouTube');
        document.getElementById('yt-btn').onclick = () => window.open(yt ? `https://youtube.com/watch?v=${yt.key}` : `https://youtube.com/results?search_query=${data.name || data.title}`);

        document.getElementById('h-cast').innerHTML = data.credits.cast.slice(0,12).map(c => `
            <div class="actor-pill">
                <img src="https://image.tmdb.org/t/p/w185${c.profile_path}" onerror="this.src='https://via.placeholder.com/90'">
                <p style="font-size:0.75rem; color:#888; font-weight:bold;">${c.name}</p>
            </div>
        `).join('');

        // Default AI Engine: Groq Pro
        askAI('groq');
        showL(false);
    }

    async function askAI(mode) {
        const out = document.getElementById('ai-content');
        out.innerHTML = `<span style="color:var(--accent)"><i class="fas fa-cog fa-spin"></i> ${mode.toUpperCase()} is processing the metadata...</span>`;
        
        const title = currentItem.name || currentItem.title;
        const prompt = `Act as a movie critic. Provide a massive, deep analysis for "${title}" in English. Include secret production trivia, technical score, and why people should watch it. Minimum 400 words.`;

        try {
            if(mode === 'gemini') {
                // Fixed Gemini Integration using specialized endpoint
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_KEY}`;
                const response = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const gData = await response.json();
                out.innerText = gData.candidates[0].content.parts[0].text;
            } else if(mode === 'groq') {
                const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${GROQ_KEY}`, "Content-Type": "application/json" },
                    body: JSON.stringify({ model: "llama-3.3-70b-versatile", messages: [{ role: "user", content: prompt }] })
                }).then(r => r.json());
                out.innerText = res.choices[0].message.content;
            } else if(mode === 'openrouter') {
                const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${OR_KEY}`, "Content-Type": "application/json" },
                    body: JSON.stringify({ model: "meta-llama/llama-3.1-70b-instruct", messages: [{ role: "user", content: prompt }] })
                }).then(r => r.json());
                out.innerText = res.choices[0].message.content;
            } else {
                const res = await fetch("https://api.cerebras.ai/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${CEREBRAS_KEY}`, "Content-Type": "application/json" },
                    body: JSON.stringify({ model: "llama3.1-70b", messages: [{ role: "user", content: prompt }] })
                }).then(r => r.json());
                out.innerText = res.choices[0].message.content;
            }
        } catch(e) {
            out.innerHTML = `<span style="color:#ff3333">AI Connection Failed. Please check your VPN or try another engine.</span>`;
        }
    }

    function goHome(push = true) {
        if(push) history.pushState(null, '', ' ');
        document.getElementById('details-view').style.display = 'none';
        document.getElementById('list-view').style.display = 'block';
    }

    function showL(s) { document.getElementById('main-loader').style.display = s?'flex':'none'; }
    
    init();
</script>
</body>
</html>
